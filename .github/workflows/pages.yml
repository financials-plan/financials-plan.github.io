name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site (chi dang tep web can thiet)
        shell: bash
        run: |
          mkdir -p _site/backend
          cp index.html main.html 404.html _site/
          cp -r auth css js config pdf-to-interactive-infographic _site/
          cp backend/firestore-service.js _site/backend/
          rm -f _site/config/*.md
          test -f _site/main.html && test -f _site/backend/firestore-service.js && test -f _site/config/firebase-config.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
